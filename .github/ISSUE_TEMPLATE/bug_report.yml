name: Bug report
description: Report a reproducible problem in Murmura.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: main, v0.1.0, or commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Python 3.11, Node 20, macOS 15, Chrome 125
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, API keys, private text, and local-only paths before posting.
      render: shell

